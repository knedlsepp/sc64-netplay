name: Nix-Flake prüfen

on:
  push:
    branches: [main]
    paths-ignore:
      - 'chat.z64'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lock-Datei anlegen bzw. ergänzen
        run: nix flake lock

      - name: Webseite samt Chat-ROM bauen
        run: nix build .#web -L

      - name: Flake-Checks
        run: nix flake check -L

      - name: Neue Lock-Datei einchecken
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            echo "flake.lock unverändert."
          else
            git commit -m "flake.lock anlegen"
            git pull --rebase
            git push
          fi
